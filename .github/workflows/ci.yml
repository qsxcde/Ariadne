name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ariadne
          POSTGRES_PASSWORD: ariadne_dev
          POSTGRES_DB: ariadne_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ariadne -d ariadne_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # The current test suite covers the SQLite repositories, upload intake,
      # authorization rules and the snapshot GC. It does not need torch / faiss,
      # so installing the full RAG stack here would only slow CI down.
      - name: Install test dependencies
        run: |
          uv venv .venv-ci
          uv pip install --python .venv-ci/bin/python \
            pytest pytest-asyncio fastapi pydantic pydantic-settings \
            python-jose bcrypt httpx ruff mypy \
            "psycopg[binary,pool]" \
            openai langchain langgraph langchain-openai langgraph-checkpoint-sqlite

      - name: Lint (ruff)
        run: .venv-ci/bin/ruff check backend/src tests

      # 类型检查覆盖存储层、领域层与用例层
      - name: Type check (mypy, storage + domain + application)
        run: >-
          .venv-ci/bin/mypy --config-file backend/pyproject.toml
          backend/src/backend/storage backend/src/backend/domain backend/src/backend/application

      - name: Byte-compile all sources
        run: .venv-ci/bin/python -m compileall -q backend/src

      - name: Run tests (SQLite)
        run: .venv-ci/bin/python -m pytest -m "unit or integration"

      - name: Run tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://ariadne:ariadne_dev@127.0.0.1:5432/ariadne_test
        run: .venv-ci/bin/python -m pytest -m "unit or integration"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 生成的类型必须与 contracts/openapi.json 一致，否则说明改了契约没重新生成
      - name: Verify generated types
        run: |
          npm run gen
          git diff --exit-code -- src/shared/contracts

      - name: Build
        run: npm run build
