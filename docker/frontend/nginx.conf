server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /features { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /sessions/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /documents { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /papers { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /collections { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /annotations { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /subscriptions { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /feed { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /notifications { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /settings/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /review/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /digest { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /health { proxy_pass http://backend:8000; proxy_set_header Host $host; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
